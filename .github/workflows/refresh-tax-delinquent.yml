name: Refresh Siskiyou tax-delinquent data

on:
  schedule:
    # Monthly, 4 AM PST / 5 AM PDT on the first day of the month.
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-siskiyou-tax-delinquent
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify current tax-default status
        run: npm run refresh:tax-delinquent
      - name: Commit refreshed tax data
        run: |
          if ! git diff --quiet -- data/siskiyou-tax-delinquent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/siskiyou-tax-delinquent.json
            git commit -m "refresh Siskiyou tax-delinquent data $(date -u +'%Y-%m-%d')"
            git push
          fi
      - run: npm run deploy
