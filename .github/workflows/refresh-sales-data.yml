name: Refresh sales data

on:
  schedule:
    # GitHub schedules use UTC: 4 AM PST / 5 AM PDT.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sales-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh sales data
        run: npm run refresh

      - name: Validate refreshed data
        run: npm test

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data; then
            echo "Sales data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "refresh sales data $(date -u +'%Y-%m-%d')"
          git push
