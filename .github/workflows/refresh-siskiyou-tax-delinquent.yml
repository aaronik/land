name: Refresh Siskiyou tax delinquency

on:
  schedule:
    # Twice weekly: Tuesdays and Fridays at 18:00 UTC.
    - cron: '0 18 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-siskiyou-tax-delinquent
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck candidate tax parcels against the County
        run: npm run refresh:tax-delinquent

      - name: Validate refreshed data
        run: npm test

      - name: Commit refreshed tax layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/siskiyou-tax-delinquent.json
          if git diff --cached --quiet; then
            echo "Tax layer is already current."
          else
            git commit -m "refresh Siskiyou tax delinquency $(date -u +'%Y-%m-%d')"
            # The monthly crawl and daily sales refresh may push during this run.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not push refreshed tax data after five attempts." >&2
                exit 1
              fi
              sleep 10
            done
          fi

      - name: Deploy refreshed site
        run: npm run deploy
