name: Refresh parcel boundaries

on:
  schedule:
    # Monthly on the 3rd at 15:00 UTC, after the tax crawl starts.
    - cron: '0 15 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-parcel-boundaries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install tile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            -o /tmp/go-pmtiles.tar.gz
          mkdir -p /tmp/go-pmtiles
          tar -xzf /tmp/go-pmtiles.tar.gz -C /tmp/go-pmtiles
          sudo install /tmp/go-pmtiles/pmtiles /usr/local/bin/pmtiles

      - name: Download current county parcels
        run: npm run layers:download -- parcels

      - name: Check whether county parcels changed
        id: changed
        run: |
          if git diff --quiet -- data/raw/parcels.geojson data/generated/apn-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "County parcel data is unchanged; skipping tile build and deployment."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updated parcel tiles
        if: steps.changed.outputs.changed == 'true'
        run: npm run layers:build -- parcels

      - name: Validate site
        if: steps.changed.outputs.changed == 'true'
        run: npm test && npm run build

      - name: Commit refreshed parcel boundaries
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/parcels.geojson data/generated/apn-index.json data/generated/parcels.pmtiles data/generated/sources.json
          git commit -m "refresh county parcel boundaries $(date -u +'%Y-%m-%d')"
          # Other workflows can push during this run; do not overwrite their work.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not push refreshed parcel boundaries after five attempts." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Deploy updated map
        if: steps.changed.outputs.changed == 'true'
        run: npm run deploy
